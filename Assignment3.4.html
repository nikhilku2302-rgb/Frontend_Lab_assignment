
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .clock-container {
            text-align: center;
            background: #1e293b;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0005;
        }

        #clock {
            font-size: 42px;
            font-weight: bold;
            color: #65e6c4;
            margin: 20px 0;
        }

        #date {
            font-size: 18px;
            color: #d0d8e5;
        }
    </style>
</head>
<body>

<div class="clock-container">
    <h1>Digital Clock</h1>
    <div id="clock" aria-label="Current time">--:--:--</div>
    <div id="date"></div>
</div>

<script>
    function updateClock() {
        let now = new Date();

        let time = now.toLocaleTimeString("en-IN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        });

        let date = now.toLocaleDateString("en-IN", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });

        document.getElementById("clock").textContent = time;
        document.getElementById("date").textContent = date;
    }

    updateClock();

    setInterval(updateClock, 1000);
</script>

</body>
</html>
