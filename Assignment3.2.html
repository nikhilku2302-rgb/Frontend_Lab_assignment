
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1eaff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
            width: 320px;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 8px;
            border-radius: 5px;
        }

        input { border: 1px solid #bbb; }

        button {
            border: none;
            background: #6c3dcc;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .error {
            color: #c62828;
            font-size: 13px;
            margin: 4px 0;
        }

        #success {
            color: #16803c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    <form id="signupForm" novalidate>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <p class="error" id="nameError"></p>

        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter your email">
        <p class="error" id="emailError"></p>

        <label for="password">Password</label>
        <input type="password" id="password"
               placeholder="At least 8 characters">
        <p class="error" id="passwordError"></p>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Re-enter password">
        <p class="error" id="confirmError"></p>

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter your age">
        <p class="error" id="ageError"></p>

        <button type="submit">Sign Up</button>
        <p id="success" aria-live="polite"></p>
    </form>
</div>

<script>
    document.getElementById("signupForm").addEventListener(
        "submit", function(event) {

        event.preventDefault();

        // Clear old messages
        document.querySelectorAll(".error").forEach(function(item) {
            item.textContent = "";
        });
        document.getElementById("success").textContent = "";

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let confirmPassword =
            document.getElementById("confirmPassword").value;
        let ageText = document.getElementById("age").value.trim();
        let age = Number(ageText);

        let valid = true;

        if (name.length < 2) {
            document.getElementById("nameError").textContent =
                "Enter a name with at least 2 characters.";
            valid = false;
        }

        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            document.getElementById("emailError").textContent =
                "Enter a valid email address.";
            valid = false;
        }

        if (password.length < 8) {
            document.getElementById("passwordError").textContent =
                "Password must contain at least 8 characters.";
            valid = false;
        }

        if (password !== confirmPassword || confirmPassword === "") {
            document.getElementById("confirmError").textContent =
                "Passwords do not match.";
            valid = false;
        }

        if (ageText === "" || !Number.isFinite(age) ||
            age < 18 || age > 120) {
            document.getElementById("ageError").textContent =
                "Age must be between 18 and 120.";
            valid = false;
        }

        if (valid) {
            document.getElementById("success").textContent =
                "Signup successful! Welcome, " + name + ".";

            document.getElementById("signupForm").reset();
        }
    });
</script>

</body>
</html>
